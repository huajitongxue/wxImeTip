<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"
     width="256" height="256" role="img">
  <title>ImeTip</title>
  <desc>深色圆角方块内并排的青绿中字与琥珀英字，中间一条竖线分隔。</desc>

  <rect width="256" height="256" rx="56" fill="#262628"/>
  <rect x="4" y="4"
        width="248" height="248"
        rx="52" fill="none"
        stroke="#55555A" stroke-width="8"/>

  <line x1="128" y1="26" x2="128" y2="230"
        stroke="#55555A" stroke-width="4"/>

  <text x="67" y="128" text-anchor="middle"
        dominant-baseline="central"
        font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"
        font-size="96" font-weight="700" fill="#4EC9B0">中</text>
  <text x="189" y="128" text-anchor="middle"
        dominant-baseline="central"
        font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"
        font-size="96" font-weight="700" fill="#E0A458">英</text>
</svg>
